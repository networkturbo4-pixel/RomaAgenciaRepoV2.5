<!DOCTYPE html>

  <title>DeckCraft</title>
  
  <script>
    // =========================================================================
    // DECKCRAFT AUTO-SAVE & DRIVE SYNC HOOKS
    // =========================================================================
    (function() {
      let _lastBlob = null;
      let _lastBlobTime = 0;

      // 1. Interceptar creación de ObjectURL para capturar el Blob de la presentación
      const _origCreateObjectURL = URL.createObjectURL;
      URL.createObjectURL = function(obj) {
        if (obj instanceof Blob) {
          _lastBlob = obj;
          _lastBlobTime = Date.now();
        }
        return _origCreateObjectURL.apply(URL, arguments);
      };

      // 2. Interceptar clic en enlaces de descarga generados por WASM
      const _origAnchorClick = HTMLAnchorElement.prototype.click;
      HTMLAnchorElement.prototype.click = function() {
        const downloadName = (this.download || '').toLowerCase();
        const isPpt = downloadName.endsWith('.pptx') || downloadName.endsWith('.ppt') || downloadName.endsWith('.deckcraft');

        if (isPpt && _lastBlob && (Date.now() - _lastBlobTime < 10000)) {
          const blobToSync = _lastBlob;
          const fileNameToSync = this.download;
          
          if (window.parent && window.parent !== window) {
            try {
              window.parent.postMessage({
                type: 'DECKCRAFT_FILE_SAVED',
                filename: fileNameToSync,
                blob: blobToSync
              }, '*');
              console.log('[DeckCraft Hook] Notified parent of saved PPTX:', fileNameToSync, blobToSync.size, 'bytes');
            } catch (err) {
              console.warn('[DeckCraft Hook] PostMessage error:', err);
            }
          }
        }
        return _origAnchorClick.apply(this, arguments);
      };

      // 3. Responder a solicitudes de guardado y carga enviadas por el CRM
      window.addEventListener('message', function(evt) {
        if (!evt.data) return;
        
        if (evt.data.type === 'TRIGGER_SAVE') {
          triggerSaveShortcut();
        } else if (evt.data.type === 'LOAD_DECK_BLOB' && evt.data.blob) {
          loadBlobIntoDeck(evt.data.blob, evt.data.filename || 'presentation.pptx');
        }
      });

      function triggerSaveShortcut() {
        const canvas = document.getElementById('deckcraft_canvas');
        if (canvas) {
          canvas.focus();
        }
        const keyEvt = new KeyboardEvent('keydown', {
          key: 's',
          code: 'KeyS',
          keyCode: 83,
          which: 83,
          ctrlKey: true,
          metaKey: true,
          bubbles: true,
          cancelable: true
        });
        if (canvas) canvas.dispatchEvent(keyEvt);
        window.dispatchEvent(keyEvt);
      }

      function loadBlobIntoDeck(blob, filename) {
        const file = new File([blob], filename, {
          type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation'
        });
        const dt = new DataTransfer();
        dt.items.add(file);

        const canvas = document.getElementById('deckcraft_canvas');
        ['dragenter', 'dragover', 'drop'].forEach(evtName => {
          const dEvt = new DragEvent(evtName, {
            bubbles: true,
            cancelable: true,
            dataTransfer: dt
          });
          if (canvas) canvas.dispatchEvent(dEvt);
          window.dispatchEvent(dEvt);
        });
        console.log('[DeckCraft Hook] Injected file into deck:', filename, blob.size, 'bytes');
      }

      // 4. Si se especificó ?load= en la URL, cargar automáticamente el archivo PPTX
      const urlParams = new URLSearchParams(window.location.search);
      const loadUrl = urlParams.get('load');

      if (loadUrl) {
        window.addEventListener('TrunkApplicationStarted', function() {
          // Esperar que eframe inicialice completamente su canvas y listeners
          setTimeout(async function() {
            try {
              console.log('[DeckCraft Hook] Fetching deck from:', loadUrl);
              const resp = await fetch(loadUrl);
              if (!resp.ok) throw new Error('HTTP ' + resp.status);
              const blob = await resp.blob();
              const filename = loadUrl.split('/').pop() || 'presentation.pptx';
              loadBlobIntoDeck(blob, filename);
            } catch (loadErr) {
              console.warn('[DeckCraft Hook] Could not auto-load presentation:', loadErr);
            }
          }, 850);
        });
      }
    })();
  </script>

<script type="module">

</script>
