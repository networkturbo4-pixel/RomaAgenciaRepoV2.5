name: Compilar APK Android (ROMA)

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'URL del Sistema ROMA'
        required: false
        default: 'https://romaagencia.lat'
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Configurar URL del Sistema y Sincronizar Icono en Vivo desde Producción
        run: |
          TARGET_URL="${{ github.event.inputs.server_url }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://romaagencia.lat"
          fi
          echo "Sincronizando URL y Favicon desde: $TARGET_URL"
          sed -i "s|<string name=\"server_url\">.*</string>|<string name=\"server_url\">${TARGET_URL}</string>|g" android-app/app/src/main/res/values/strings.xml

          # Incrementar versionCode automáticamente en cada compilación para que Android actualice el icono y la APK sin conflicto
          NEW_VER_CODE=$((10 + ${{ github.run_number }}))
          sed -i "s|versionCode [0-9]*|versionCode ${NEW_VER_CODE}|g" android-app/app/build.gradle
          sed -i "s|versionName \".*\"|versionName \"2.1.${{ github.run_number }}\"|g" android-app/app/build.gradle

          # Extraer favicon en vivo desde el servidor de producción y regenerar todos los mipmap-* antes de compilar
          FAV_PATH=$(curl -sL "$TARGET_URL" | grep -oE '<link rel="icon" href="[^"]+"' | head -n 1 | sed -E 's/.*href="([^"]+)".*/\1/')
          if [ -n "$FAV_PATH" ]; then
            if [[ "$FAV_PATH" == http* ]]; then
              FAV_URL="$FAV_PATH"
            else
              FAV_URL="${TARGET_URL%/}/${FAV_PATH#/}"
            fi
            echo "Descargando favicon de producción: $FAV_URL"
            curl -sL "$FAV_URL" -o /tmp/live_favicon.png && [ -s /tmp/live_favicon.png ] && php -r '
              require "includes/AndroidAppSyncHelper.php";
              AndroidAppSyncHelper::generateIconsFromImage("/tmp/live_favicon.png", getcwd());
              echo "Iconos regenerados exitosamente desde producción.\n";
            ' || true
          fi

      - name: Dar permisos de ejecución a Gradlew
        run: chmod +x android-app/gradlew

      - name: Compilar APK (Release firmado)
        run: |
          cd android-app
          set +e
          gradle assembleRelease --stacktrace --console=plain > ../gradle-build.log 2>&1
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "Gradle fall�, mostrando errores:"
            grep -E "error:|What went wrong|Execution failed for|AAPT: error|Manifest merger failed" -A4 ../gradle-build.log | head -n 40 | while IFS= read -r line; do echo "::error::${line}"; done
            tail -n 60 ../gradle-build.log
            exit $RC
          fi
      - name: Renombrar APK generado
        run: |
          mkdir -p output-apk
          cp android-app/app/build/outputs/apk/release/app-release.apk output-apk/ROMA-app.apk || cp android-app/app/build/outputs/apk/debug/app-debug.apk output-apk/ROMA-app.apk

      - name: Subir APK como Artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ROMA-Android-APK
          path: output-apk/ROMA-app.apk
          retention-days: 30

      - name: Publicar Release directa con APK en GitHub
        uses: softprops/action-gh-release@v2
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: 'app-apk-latest'
          name: 'ROMA App Android (Descarga Oficial)'
          body: |
            ### 📱 Aplicación Móvil Android para ROMA
            Descarga el archivo **ROMA-app.apk** directamente en tu celular Android e instálalo.
            
            * **Sincronización en tiempo real**: Cualquier actualización que subas al servidor se refleja inmediatamente en la app.
            * **Funciones nativas**: Cámara, subida de archivos, descargas de PDFs, persistencia de sesión y navegación fluida.
          draft: false
          prerelease: false
          files: output-apk/ROMA-app.apk

      - name: Resumen de Compilación
        run: |
          echo "### ✅ APK Compilado con Éxito" >> $GITHUB_STEP_SUMMARY
          echo "El archivo **ROMA-app.apk** está listo para descargar en la sección de Releases y Artefactos." >> $GITHUB_STEP_SUMMARY


